# Starlight app bundle for make test-fheroes2: fheroes2.app (build.sh app)
# under a title that sorts first, so the test finds it at the top of the
# dock. The rest as userland/ports/fheroes2/app/app.ini: the demo comes
# from a USB stick image (build.sh stick), copied on the first start
# (never in git nor in a published image).
title=0 fheroes2 check
category=svago
dock=yes
exec=./app.bin
args=
capabilities=fs.read, fs.write, shm, audio
paths=/system/apps/fheroes2check.app:r, /media1:r, /media2:r, /media3:r, /media4:r, /home:r, /starlight/config:rw
width=800
height=600
min_width=640
min_height=480
