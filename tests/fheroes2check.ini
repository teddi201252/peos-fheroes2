# Starlight app bundle for make test-fheroes2 (phase 3): fheroes2 with its
# own files (files/data, files/timidity) and, in the test's live root
# only, the Heroes II demo in /starlight/config/fheroes2 (never in git nor
# in a published image). The title sorts first, so the test finds it at
# the top of the dock.
title=0 fheroes2 check
category=svago
dock=yes
exec=./app.bin
args=
capabilities=fs.read, fs.write, shm, audio
paths=/system/apps/fheroes2check.app:r, /starlight/config:rw
width=800
height=600
min_width=640
min_height=480
