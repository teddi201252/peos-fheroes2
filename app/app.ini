# Starlight app bundle: fheroes2, the free engine of Heroes of Might and
# Magic II (GPL-2.0), for PeOS (userland/ports/fheroes2,
# docs/game-ports-plan.md). app.bin is fheroes2; files/ are its own (the
# engine's data, translations, timidity's instruments). The game's data are
# the user's: on the first start fheroes2 finds DATA/HEROES2.AGG on a USB
# stick or in /home and copies DATA, MAPS, MUSIC and ANIM to
# /starlight/config/fheroes2, where its settings and saves also go.
# shm: the window's pixels (drawn in software); audio: sounds and music;
# fs.write: the copy, the settings, the saves.
# paths: at most 8 (PEOS_PATH_MAX_GRANTS).
title=fheroes2
version=1.1.18
author=The fheroes2 Resurrection Team (GPL-2.0), ported by PeOS; the game's data: the user's
category=svago
dock=yes
store_category=giochi
min_peos=0.18.0
exec=./app.bin
args=
capabilities=fs.read, fs.write, shm, audio
paths=/system/apps/fheroes2.app:r, /apps/fheroes2.app:r, /media1:r, /media2:r, /media3:r, /media4:r, /home:r, /starlight/config:rw
icon=res:icon
width=800
height=600
min_width=640
min_height=480

# Resources
[resources]
icon=./resources/icon.png
